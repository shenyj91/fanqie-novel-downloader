name: Build Windows exe

on:
  workflow_dispatch:   # 手动触发
  push:
    tags: ['v*']       # 打 tag 时自动打包

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install pyinstaller pycryptodome

      - name: Build long exe
        working-directory: .
        run: |
          python build_exe.py

      - name: Upload long exe
        uses: actions/upload-artifact@v4
        with:
          name: 番茄小说下载器-exe
          path: dist/番茄小说下载器.exe

      - name: Build agg exe
        working-directory: .
        run: |
          python build_exe_agg.py

      - name: Upload agg exe
        uses: actions/upload-artifact@v4
        with:
          name: 番茄七猫聚合下载器-exe
          path: dist/番茄七猫聚合下载器.exe
